  order: ASC
always_available: true
fields:
- identifier: bo_title
  type: ibexa_string
  name: BO Title
  description: Title is used for admin concerns
  required: true
  searchable: true
  translatable: true
  category: back_office
  position: 0
- identifier: logo_text
