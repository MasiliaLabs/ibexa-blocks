services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Masilia\IbexaBlocks\Conventions:
        factory: ['Masilia\IbexaBlocks\Conventions', 'fromSettings']
        arguments: ['%masilia_blocks.conventions%']

    # The content model of the templates.
    Masilia\Bundle\IbexaBlocks\Content\:
        resource: '../../Content/'
        exclude:
            - '../../Content/ContentFields.php'
            - '../../Content/RenderableContent.php'
            - '../../Content/UnsupportedFieldType.php'

    # The renderers get their locator from FieldRendererPass: they are built when their field type is first read.
    Masilia\Bundle\IbexaBlocks\Content\FieldRendererRegistry:
        arguments:
            $logger: '@logger'

    # The search of a site: what it may search is the settings', not the code's.
    Masilia\IbexaBlocks\Search\SearchSettings:
        factory: ['Masilia\IbexaBlocks\Search\SearchSettings', 'fromSettings']
        arguments: ['%masilia_blocks.search%']
    Masilia\Bundle\IbexaBlocks\Search\:
        resource: '../../Search/'
    Masilia\Bundle\IbexaBlocks\Controller\SearchController: ~

    # Forms submitted by mail.
    Masilia\IbexaBlocks\Form\FormSettings:
        factory: ['Masilia\IbexaBlocks\Form\FormSettings', 'fromSettings']
        arguments: ['%masilia_blocks.forms%']
    Masilia\Bundle\IbexaBlocks\Mail\:
        resource: '../../Mail/'
        exclude: '../../Mail/FormDefinition.php'
    Masilia\Bundle\IbexaBlocks\Controller\FormSubmitController: ~

    # Contact forms (a matrix of questions on the page): the settings, the builder; the provider is made by the extension.
    Masilia\IbexaBlocks\Form\ContactSettings:
        factory: ['Masilia\IbexaBlocks\Form\ContactSettings', 'fromSettings']
        arguments: ['%masilia_blocks.forms%']
    Masilia\Bundle\IbexaBlocks\Form\MatrixFormBuilder: ~

    # Themes and the blocks they show.
    Masilia\Bundle\IbexaBlocks\Theme\:
        resource: '../../Theme/'
    # For the assistant (masilia/ibexa-ai-craft): which blocks a siteaccess can show.
    Masilia\Contracts\IbexaBlocks\ShownBlocks: '@Masilia\Bundle\IbexaBlocks\Theme\ThemeShownBlocks'
    Masilia\Contracts\IbexaBlocks\ShownViews: '@Masilia\Bundle\IbexaBlocks\Theme\ThemeShownBlocks'
    Masilia\Contracts\IbexaBlocks\Themes: '@Masilia\Bundle\IbexaBlocks\Theme\ThemeCatalog'
    Masilia\Contracts\IbexaBlocks\ListPreview: '@Masilia\Bundle\IbexaBlocks\Search\ListedContents'
    Masilia\Bundle\IbexaBlocks\Search\ContentLister: '@Masilia\Bundle\IbexaBlocks\Search\LatestContents'
    Masilia\Bundle\IbexaBlocks\Block\:
        resource: '../../Block/'
        exclude:
            - '../../Block/ResolvedView.php'
            # Made by the extension, from the settings of the lists.
            - '../../Block/Provider/'
    # The content model: the socle of the package and the content_types/ of the themes.
    Masilia\Bundle\IbexaBlocks\Model\:
        resource: '../../Model/'
        exclude:
            - '../../Model/InvalidModel.php'
            - '../../Model/TypeDefinition.php'
            - '../../Model/ModelPlan.php'
    Masilia\Bundle\IbexaBlocks\Site\SiteCreator:
        arguments:
            $registry: '@?Masilia\Contracts\IbexaSites\SiteRegistry'
    Masilia\Bundle\IbexaBlocks\Command\:
        resource: '../../Command/'
    Masilia\Bundle\IbexaBlocks\Theme\ThemeChecker:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $referenceDirs: ['%kernel.project_dir%/src', '%kernel.project_dir%/config/packages']

    Masilia\Bundle\IbexaBlocks\Controller\:
        resource: '../../Controller/'
        exclude: '../../Controller/SubscriptionController.php'
        tags: ['controller.service_arguments']
    # Below the project's own content_view rules (priority 10) and above Ibexa's defaults (-1).
    Masilia\Bundle\IbexaBlocks\View\BlockViewProvider:
        tags:
            - { name: ibexa.view.provider, type: 'Ibexa\Core\MVC\Symfony\View\ContentView', priority: 5 }
    Masilia\Bundle\IbexaBlocks\Templating\BlocksExtension: ~
    Masilia\Bundle\IbexaBlocks\Templating\BlocksRuntime:
        arguments:
            $fragments: '@fragment.handler'

    # What the content model asks of the rest of the application. Replace an alias to change how links, breadcrumbs, admin
    # meta or cache tags are made.
    Masilia\Bundle\IbexaBlocks\Site\:
        resource: '../../Site/'
    Masilia\Bundle\IbexaBlocks\Site\LayoutProvider:
        arguments:
            $config: '@ibexa.config.resolver'

    Masilia\Contracts\IbexaBlocks\MenuProvider:
        alias: Masilia\Bundle\IbexaBlocks\Site\NullMenuProvider
    Masilia\Contracts\IbexaBlocks\LinkProvider:
        alias: Masilia\Bundle\IbexaBlocks\Site\UrlAliasLinkProvider
    Masilia\Contracts\IbexaBlocks\BreadcrumbProvider:
        alias: Masilia\Bundle\IbexaBlocks\Site\LocationBreadcrumbProvider
    Masilia\Contracts\IbexaBlocks\AdminMetaProvider:
        alias: Masilia\Bundle\IbexaBlocks\Site\NullAdminMetaProvider
    Masilia\Contracts\IbexaBlocks\CacheTagger:
        alias: Masilia\Bundle\IbexaBlocks\Site\NullCacheTagger
