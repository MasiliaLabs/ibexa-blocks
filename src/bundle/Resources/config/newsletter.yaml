# Loaded when masilia_ibexa_blocks.system.<scope>.newsletter.enabled is true for one scope at least.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Masilia\Bundle\IbexaBlocks\Newsletter\:
        resource: '../../Newsletter/'
        exclude: '../../Newsletter/SubscriptionResult.php'
    Masilia\Bundle\IbexaBlocks\Newsletter\SubscriberStore: '@Masilia\Bundle\IbexaBlocks\Newsletter\DoctrineSubscriberStore'
    # For the assistant (masilia/ibexa-ai-craft).
    Masilia\Contracts\IbexaBlocks\Subscribers: '@Masilia\Bundle\IbexaBlocks\Newsletter\StoredSubscribers'

    Masilia\Bundle\IbexaBlocks\Controller\SubscriptionController:
        tags: ['controller.service_arguments']
