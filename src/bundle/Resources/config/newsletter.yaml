# Loaded when masilia_ibexa_blocks.newsletter.enabled is true.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Masilia\IbexaBlocks\Newsletter\NewsletterSettings:
        factory: ['Masilia\IbexaBlocks\Newsletter\NewsletterSettings', 'fromSettings']
        arguments: ['%masilia_blocks.newsletter%']

    Masilia\Bundle\IbexaBlocks\Newsletter\:
        resource: '../../Newsletter/'
        exclude: '../../Newsletter/SubscriptionResult.php'
    Masilia\Bundle\IbexaBlocks\Newsletter\SubscriberStore: '@Masilia\Bundle\IbexaBlocks\Newsletter\DoctrineSubscriberStore'

    Masilia\Bundle\IbexaBlocks\Controller\SubscriptionController:
        tags: ['controller.service_arguments']
